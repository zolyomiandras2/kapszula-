<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kapszula | Kettőnknek</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #08080a;
      color: #f3f3f5;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif { font-family: 'Playfair Display', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-hand { font-family: 'Caveat', cursive; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake { animation: shake 0.5s ease-in-out infinite; }
  </style>
</head>
<body class="selection:bg-rose-500/30 selection:text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = "https://jpbzlvfxrkmiazaeanaw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwYnpsdmZ4cmttaWF6YWVhbmF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjIxMTMsImV4cCI6MjEwODkzODExM30.dMvV3SoUvUyuZSvn2omHvhoF5Yy9pMCJdpIsJun5rDE";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Scratch Card Komponens
    function ScratchCard({ text }) {
      const [scratched, setScratched] = useState(false);
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width = canvas.offsetWidth;
        const height = canvas.height = canvas.offsetHeight;

        // Arany-bronz kaparós réteg felrajzolása
        const gradient = ctx.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, '#785428');
        gradient.addColorStop(0.5, '#d4af37');
        gradient.addColorStop(1, '#5a3e1b');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#ffffff';
        ctx.font = '12px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.fillText('✨ Kapard le a válaszért! ✨', width / 2, height / 2 + 4);

        let isDrawing = false;
        let points = 0;

        const scratch = (e) => {
          if (!isDrawing) return;
          const rect = canvas.getBoundingClientRect();
          const clientX = e.clientX || (e.touches && e.touches[0].clientX);
          const clientY = e.clientY || (e.touches && e.touches[0].clientY);
          const x = clientX - rect.left;
          const y = clientY - rect.top;

          ctx.globalCompositeOperation = 'destination-out';
          ctx.beginPath();
          ctx.arc(x, y, 18, 0, Math.PI * 2);
          ctx.fill();

          points++;
          if (points > 35) {
            setScratched(true);
          }
        };

        const start = () => { isDrawing = true; };
        const stop = () => { isDrawing = false; };

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', stop);

        canvas.addEventListener('touchstart', start);
        canvas.addEventListener('touchmove', scratch);
        window.addEventListener('touchend', stop);

        return () => {
          window.removeEventListener('mouseup', stop);
          window.removeEventListener('touchend', stop);
        };
      }, []);

      return (
        <div className="relative min-h-[90px] rounded-2xl overflow-hidden flex items-center justify-center p-4 bg-neutral-900/60 border border-neutral-800">
          <p className="text-sm text-amber-100 font-serif leading-relaxed italic z-0">
            „{text}”
          </p>
          {!scratched && (
            <canvas 
              ref={canvasRef} 
              className="absolute inset-0 w-full h-full cursor-pointer z-10 touch-none"
            />
          )}
        </div>
      );
    }

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const userParam = urlParams.get('user');
      const currentUser = userParam === 'detticica' ? 'detticica' : 'me';
      const partnerUser = currentUser === 'me' ? 'detticica' : 'me';

      const [questions, setQuestions] = useState([]);
      const [currentDay, setCurrentDay] = useState(1);
      const [todayUnlockedDay, setTodayUnlockedDay] = useState(1);
      const [answers, setAnswers] = useState({ me: null, detticica: null });
      const [inputText, setInputText] = useState('');
      const [loading, setLoading] = useState(true);
      const [submitting, setSubmitting] = useState(false);

      const [capsule, setCapsule] = useState(null);
      const [uploadingPhoto, setUploadingPhoto] = useState(false);
      const [nudged, setNudged] = useState(false);
      const [nightMessage, setNightMessage] = useState('');
      const [nightNotes, setNightNotes] = useState([]);
      const fileInputRef = useRef(null);

      // Éjszakai bagoly időablak: 22:00 és 05:00 között
      const currentHour = new Date().getHours();
      const isNightTime = currentHour >= 22 || currentHour < 5;

      useEffect(() => {
        calculateTodayDay();
        loadData();
        loadCapsule();
        loadNightNotes();

        const channel = supabase
          .channel('realtime_stream')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'answers' }, () => {
            loadAnswers(currentDay);
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'time_capsule' }, () => {
            loadCapsule();
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'nudges' }, (payload) => {
            if (payload.new.from_user !== currentUser) {
              setNudged(true);
              setTimeout(() => setNudged(false), 5000);
            }
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'night_notes' }, () => {
            loadNightNotes();
          })
          .subscribe();

        return () => supabase.removeChannel(channel);
      }, [currentDay]);

      // Napi feloldási kalkulátor
      const calculateTodayDay = () => {
        // Kezdődátum rögzítése: ma
        const startDateKey = 'kapszula_start_date';
        let startDate = localStorage.getItem(startDateKey);
        if (!startDate) {
          startDate = new Date().toISOString().split('T')[0];
          localStorage.setItem(startDateKey, startDate);
        }
        const diffDays = Math.floor((new Date() - new Date(startDate)) / (1000 * 60 * 60 * 24)) + 1;
        const currentActive = Math.max(1, diffDays);
        setTodayUnlockedDay(currentActive);
        setCurrentDay(currentActive);
      };

      const loadData = async () => {
        const { data: qData } = await supabase
          .from('questions')
          .select('*')
          .order('day_index', { ascending: true });

        if (qData && qData.length > 0) {
          setQuestions(qData);
          await loadAnswers(currentDay, qData);
        }
        setLoading(false);
      };

      const loadCapsule = async () => {
        const { data } = await supabase
          .from('time_capsule')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(1)
          .maybeSingle();

        if (data) setCapsule(data);
      };

      const loadNightNotes = async () => {
        const { data } = await supabase
          .from('night_notes')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(3);
        if (data) setNightNotes(data);
      };

      const loadAnswers = async (dayIdx, qList = questions) => {
        const activeQ = qList.find(q => q.day_index === dayIdx) || questions.find(q => q.day_index === dayIdx);
        if (!activeQ) return;

        const { data: aData } = await supabase
          .from('answers')
          .select('*')
          .eq('question_id', activeQ.id);

        const mapped = { me: null, detticica: null };
        if (aData) {
          aData.forEach(row => {
            if (row.user_tag === 'me') mapped.me = row.answer_text;
            if (row.user_tag === 'detticica') mapped.detticica = row.answer_text;
          });
        }
        setAnswers(mapped);
      };

      const handleSendAnswer = async () => {
        if (!inputText.trim() || submitting) return;
        setSubmitting(true);

        const activeQ = questions.find(q => q.day_index === currentDay);
        if (!activeQ) return;

        const { error } = await supabase.from('answers').upsert({
          question_id: activeQ.id,
          user_tag: currentUser,
          answer_text: inputText.trim()
        }, { onConflict: 'question_id,user_tag' });

        if (!error) {
          setInputText('');
          if (window.confetti) {
            window.confetti({ particleCount: 75, spread: 65, origin: { y: 0.7 } });
          }
          await loadAnswers(currentDay);
        }
        setSubmitting(false);
      };

      const handleNudge = async () => {
        await supabase.from('nudges').insert({ from_user: currentUser });
        alert('Megbökve! Értesítést kapott a felületén ✨');
      };

      const handleSendNightNote = async () => {
        if (!nightMessage.trim()) return;
        await supabase.from('night_notes').insert({ from_user: currentUser, message: nightMessage.trim() });
        setNightMessage('');
        loadNightNotes();
      };

      const handleFileUpload = async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        setUploadingPhoto(true);
        try {
          const fileExt = file.name.split('.').pop() || 'jpg';
          const fileName = `${Date.now()}_${currentUser}.${fileExt}`;
          const filePath = `${fileName}`;

          const { error: uploadError } = await supabase.storage
            .from('capsule-photos')
            .upload(filePath, file, { cacheControl: '3600', upsert: true });

          if (uploadError) throw uploadError;

          const { data: { publicUrl } } = supabase.storage
            .from('capsule-photos')
            .getPublicUrl(filePath);

          const unlock = new Date();
          unlock.setDate(unlock.getDate() + 7);
          const unlockDateStr = unlock.toISOString().split('T')[0];

          await supabase.from('time_capsule').insert({
            user_tag: currentUser,
            photo_url: publicUrl,
            message: 'Egy titkos emlék kettőnknek :)',
            unlock_date: unlockDateStr
          });

          if (window.confetti) window.confetti({ particleCount: 90, spread: 80 });
          await loadCapsule();
        } catch (err) {
          alert('Hiba a feltöltésnél: ' + err.message);
        } finally {
          setUploadingPhoto(false);
        }
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-[#08080a] text-neutral-400 flex items-center justify-center font-serif text-lg tracking-wide">
            Kapszula ébredése...
          </div>
        );
      }

      const activeQuestion = questions.find(q => q.day_index === currentDay) || questions[0];
      const myAnswer = answers[currentUser];
      const partnerAnswer = answers[partnerUser];
      const isBothAnswered = Boolean(myAnswer && partnerAnswer);
      const isCapsuleUnlocked = capsule && new Date(capsule.unlock_date) <= new Date();

      return (
        <div className="min-h-screen bg-[#08080a] text-neutral-100 flex justify-center px-4 py-8">
          <main className="w-full max-w-md flex flex-col gap-6">
            
            {/* Fejléc */}
            <header className="flex justify-between items-center border-b border-neutral-800/80 pb-4">
              <div className="flex items-center gap-2">
                <span className="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-[11px] uppercase tracking-widest text-neutral-400 font-mono">Privát Kapszula</span>
              </div>
              <div className="text-xs px-3 py-1 rounded-full bg-neutral-900 border border-neutral-800 text-neutral-300 font-mono">
                {currentUser === 'me' ? '👑 Én nézet' : '🐱 Detticica nézet'}
              </div>
            </header>

            {/* Bökdösés riasztás */}
            {nudged && (
              <div className="p-3 bg-rose-500/20 border border-rose-500/40 rounded-2xl text-xs text-rose-200 flex items-center justify-between animate-shake">
                <span>🐾 Hé! Valaki épp türelmetlenül várja a válaszodat!</span>
                <span className="font-mono text-[10px]">Most</span>
              </div>
            )}

            {/* Napválasztó & Zárolás Info */}
            <nav className="flex items-center justify-between bg-neutral-900/50 p-2 rounded-2xl border border-neutral-800/60">
              <button 
                onClick={() => {
                  if (currentDay > 1) {
                    const newDay = currentDay - 1;
                    setCurrentDay(newDay);
                    loadAnswers(newDay);
                  }
                }}
                disabled={currentDay === 1}
                className="px-3 py-1.5 text-xs font-mono rounded-lg transition disabled:opacity-20 hover:bg-neutral-800 active:scale-95"
              >
                ← Múlt
              </button>
              
              <div className="flex flex-col items-center">
                <span className="text-xs font-mono text-amber-300 font-medium">
                  {currentDay}. Nap {currentDay === todayUnlockedDay ? '(Mai nap ✨)' : ''}
                </span>
                {currentDay > todayUnlockedDay && (
                  <span className="text-[9px] text-neutral-500 font-mono">Zárolva holnap reggelig</span>
                )}
              </div>

              <button 
                onClick={() => {
                  if (currentDay < todayUnlockedDay && currentDay < questions.length) {
                    const newDay = currentDay + 1;
                    setCurrentDay(newDay);
                    loadAnswers(newDay);
                  }
                }}
                disabled={currentDay >= todayUnlockedDay || currentDay >= questions.length}
                className="px-3 py-1.5 text-xs font-mono rounded-lg transition disabled:opacity-20 hover:bg-neutral-800 active:scale-95"
              >
                Jövő →
              </button>
            </nav>

            {/* Napi Spotify lejátszó */}
            {activeQuestion?.spotify_track_id && (
              <section className="rounded-2xl overflow-hidden border border-neutral-800/70 shadow-lg">
                <iframe 
                  src={`https://open.spotify.com/embed/track/${activeQuestion.spotify_track_id}?utm_source=generator&theme=0`} 
                  width="100%" 
                  height="80" 
                  frameBorder="0" 
                  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                  loading="lazy">
                </iframe>
              </section>
            )}

            {/* Fő Kérdés Kártya */}
            <section className="bg-gradient-to-b from-neutral-900/90 to-neutral-900/50 border border-neutral-800/90 rounded-3xl p-6 backdrop-blur-xl shadow-2xl relative">
              <div className="flex items-center justify-between mb-3 text-[11px] font-mono tracking-wider text-amber-400 uppercase">
                <span>✦ NAPI TÉMA #{activeQuestion?.day_index}</span>
                <span className="text-neutral-500">{activeQuestion?.category}</span>
              </div>
              <h1 className="text-xl leading-relaxed text-neutral-100 font-serif italic mb-3">
                "{activeQuestion?.question_text}"
              </h1>
              {activeQuestion?.task_text && (
                <div className="mt-3 p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl text-xs text-amber-200/90 flex items-start gap-2">
                  <span className="text-sm">📌</span>
                  <span><strong>Kihívás:</strong> {activeQuestion.task_text}</span>
                </div>
              )}
            </section>

            {/* Saját válasz doboz */}
            {!myAnswer ? (
              <section className="bg-neutral-900/50 border border-neutral-800/80 rounded-2xl p-5 flex flex-col gap-3">
                <div className="flex justify-between items-center text-xs">
                  <label className="text-neutral-300 font-medium">A te titkos válaszod:</label>
                  <span className="text-[10px] text-neutral-500 font-mono">Csak ő láthatja majd</span>
                </div>
                <textarea
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  placeholder="Írd le bátran... a másik válasza csak a kölcsönös küldés után nyílik meg."
                  rows={3}
                  className="w-full bg-[#070709] border border-neutral-800 rounded-xl p-3.5 text-sm text-neutral-200 placeholder:text-neutral-600 focus:outline-none focus:border-amber-400/50 transition-all resize-none"
                />
                <button
                  onClick={handleSendAnswer}
                  disabled={submitting || !inputText.trim()}
                  className="w-full py-3 bg-gradient-to-r from-amber-500/20 via-rose-500/20 to-purple-500/20 hover:from-amber-500/30 hover:to-rose-500/30 border border-amber-500/40 rounded-xl text-sm font-medium text-amber-100 transition-all active:scale-[0.98] disabled:opacity-40"
                >
                  {submitting ? "Pecsételés..." : "✦ Válasz lezárása & küldése"}
                </button>
              </section>
            ) : (
              <div className="p-3.5 rounded-xl bg-emerald-950/20 border border-emerald-500/20 text-emerald-300/90 text-xs flex items-center justify-between">
                <span>✓ Megírtad a mai választ.</span>
                <span className="font-mono text-[10px] opacity-75">Biztonságban</span>
              </div>
            )}

            {/* Közös Válaszfal & Kaparós felület */}
            <section className="flex flex-col gap-3 pt-2">
              <div className="flex items-center justify-between px-1">
                <h2 className="text-xs uppercase tracking-widest text-neutral-500 font-mono">Közös napló</h2>
                {isBothAnswered && (
                  <span className="text-[10px] text-emerald-400 font-mono tracking-wide">● Mindkét fél válaszolt</span>
                )}
              </div>

              {/* Saját válasz */}
              <div className="p-4 rounded-2xl bg-neutral-900/30 border border-neutral-800/70">
                <div className="text-[11px] text-neutral-400 mb-1 font-mono">Te:</div>
                <p className="text-sm text-neutral-200 italic leading-relaxed">
                  {myAnswer ? `„${myAnswer}”` : "Még nem írtál választ a mai témára."}
                </p>
              </div>

              {/* Partner válasza kaparós sorsjegy formában */}
              <div className="p-4 rounded-2xl bg-neutral-900/30 border border-neutral-800/70 relative">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-[11px] text-neutral-400 font-mono">
                    {currentUser === 'me' ? 'Detticica:' : 'Én:'}
                  </span>
                  {!isBothAnswered && <span className="text-xs text-amber-400/80">🔒 Zárolva</span>}
                </div>

                {isBothAnswered ? (
                  <ScratchCard text={partnerAnswer} />
                ) : (
                  <div className="py-5 flex flex-col items-center justify-center text-center gap-2">
                    <div className="filter blur-sm select-none text-xs text-neutral-600">
                      Ez a válasz mindkettőtök számára el van rejtve.
                    </div>
                    <span className="text-[11px] text-amber-400/80 font-mono">
                      {!partnerAnswer ? "Még nem válaszolt..." : "Ő már megírta! Írd meg te is, hogy feloldódjon!"}
                    </span>
                    {myAnswer && !partnerAnswer && (
                      <button 
                        onClick={handleNudge}
                        className="mt-2 px-3 py-1 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 rounded-lg text-[11px] text-amber-200 flex items-center gap-1 active:scale-95 transition"
                      >
                        🐾 Bökd meg {currentUser === 'me' ? 'Dettit' : 'engem'}!
                      </button>
                    )}
                  </div>
                )}
              </div>
            </section>

            {/* Éjszakai Bagoly szekció (csak 22:00 - 05:00 között) */}
            {isNightTime && (
              <section className="p-4 rounded-3xl border border-indigo-900/40 bg-gradient-to-b from-indigo-950/30 to-black/70 flex flex-col gap-3">
                <div className="flex items-center gap-2 text-xs font-mono text-indigo-300">
                  <span>🌙 ÉJSZAKAI ÜZENŐFAL</span>
                  <span className="text-[10px] text-neutral-500">Még ébren vagy?</span>
                </div>
                <div className="flex gap-2">
                  <input 
                    type="text"
                    value={nightMessage}
                    onChange={(e) => setNightMessage(e.target.value)}
                    placeholder="Hagyj egy éjszakai gondolatot..."
                    className="flex-1 bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-neutral-200 focus:outline-none focus:border-indigo-500"
                  />
                  <button 
                    onClick={handleSendNightNote}
                    className="px-3 py-2 bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 rounded-xl text-xs text-indigo-200 font-medium active:scale-95"
                  >
                    Küldés
                  </button>
                </div>
                {nightNotes.length > 0 && (
                  <div className="flex flex-col gap-1.5 mt-1">
                    {nightNotes.map(n => (
                      <div key={n.id} className="text-[11px] text-neutral-300 bg-neutral-900/40 p-2 rounded-lg border border-neutral-800/40">
                        <strong className="text-indigo-300">{n.from_user === 'me' ? 'Én' : 'Detti'}:</strong> {n.message}
                      </div>
                    ))}
                  </div>
                )}
              </section>
            )}

            {/* POLAROID IDŐKAPSZULA SZEKCIÓ */}
            <footer className="mt-4 p-5 rounded-3xl border border-neutral-800/80 bg-gradient-to-b from-neutral-900/60 to-black/80 flex flex-col items-center gap-4 text-center">
              <div className="flex items-center gap-2 text-xs font-mono text-amber-400/90 tracking-wider">
                <span>⏳ KÖZÖS IDŐKAPSZULA</span>
              </div>

              {capsule ? (
                <div className="w-full flex flex-col items-center gap-3">
                  {isCapsuleUnlocked ? (
                    /* Feloldott Polaroid fotó */
                    <div className="bg-neutral-100 text-neutral-900 p-3 pb-5 rounded-lg shadow-2xl rotate-[-2deg] transition hover:rotate-0 max-w-[260px]">
                      <img src={capsule.photo_url} alt="Kapszula" className="w-full h-52 object-cover rounded" />
                      <div className="font-hand text-xl mt-3 text-center text-neutral-800">
                        {capsule.message}
                      </div>
                    </div>
                  ) : (
                    /* Zárolt lefordított Polaroid fotó */
                    <div className="bg-neutral-900 border-2 border-neutral-800 p-4 pb-6 rounded-xl shadow-2xl rotate-[1deg] max-w-[240px] flex flex-col items-center gap-3">
                      <div className="w-44 h-44 bg-neutral-950 border border-neutral-800/80 rounded flex flex-col items-center justify-center p-3 text-center gap-2">
                        <span className="text-3xl">🔒</span>
                        <span className="text-[10px] font-mono text-amber-400/90">Lakat alatt</span>
                      </div>
                      <div className="font-hand text-base text-neutral-400">
                        Felnyitás: {capsule.unlock_date}
                      </div>
                    </div>
                  )}
                </div>
              ) : (
                <div className="flex flex-col items-center gap-3 w-full">
                  <p className="text-xs text-neutral-300 max-w-xs leading-relaxed italic">
                    „Tölts fel egy képet bármiről, ami tetszene a másiknak (magadról :))”
                  </p>
                  
                  <input 
                    type="file" 
                    accept="image/*" 
                    ref={fileInputRef} 
                    onChange={handleFileUpload} 
                    className="hidden" 
                  />

                  <button
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    disabled={uploadingPhoto}
                    className="px-5 py-2.5 bg-gradient-to-r from-neutral-800 to-neutral-900 hover:from-neutral-700 hover:to-neutral-800 border border-neutral-700 rounded-xl text-xs font-medium text-neutral-200 flex items-center gap-2 transition active:scale-95 disabled:opacity-50 shadow-lg"
                  >
                    <span>📷</span>
                    <span>{uploadingPhoto ? "Feltöltés..." : "Kép elrejtése a kapszulába"}</span>
                  </button>
                </div>
              )}
            </footer>

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
