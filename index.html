<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kapszula | Kettőnknek</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0b0e;
      color: #f3f3f5;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="selection:bg-rose-500/30 selection:text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // === IDE ILLESD BE A SAJÁT KULCSAIDAT ===
    const SUPABASE_URL = "https://jpbzlvfxrkmiazaeanaw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwYnpsdmZ4cmttaWF6YWVhbmF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjIxMTMsImV4cCI6MjEwODkzODExM30.dMvV3SoUvUyuZSvn2omHvhoF5Yy9pMCJdpIsJun5rDE";
    // ======================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const userParam = urlParams.get('user');
      const currentUser = userParam === 'partner' ? 'partner' : 'me';
      const partnerUser = currentUser === 'me' ? 'partner' : 'me';

      const [questions, setQuestions] = useState([]);
      const [currentDay, setCurrentDay] = useState(1);
      const [answers, setAnswers] = useState({ me: null, partner: null });
      const [inputText, setInputText] = useState('');
      const [loading, setLoading] = useState(true);
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        loadData();

        const channel = supabase
          .channel('realtime_answers')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'answers' }, () => {
            loadAnswers(currentDay);
          })
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
        };
      }, [currentDay]);

      const loadData = async () => {
        const { data: qData } = await supabase
          .from('questions')
          .select('*')
          .order('day_index', { ascending: true });

        if (qData && qData.length > 0) {
          setQuestions(qData);
          await loadAnswers(currentDay, qData);
        }
        setLoading(false);
      };

      const loadAnswers = async (dayIdx, qList = questions) => {
        const activeQ = qList.find(q => q.day_index === dayIdx) || questions.find(q => q.day_index === dayIdx);
        if (!activeQ) return;

        const { data: aData } = await supabase
          .from('answers')
          .select('*')
          .eq('question_id', activeQ.id);

        const mapped = { me: null, partner: null };
        if (aData) {
          aData.forEach(row => {
            if (row.user_tag === 'me') mapped.me = row.answer_text;
            if (row.user_tag === 'partner') mapped.partner = row.answer_text;
          });
        }
        setAnswers(mapped);
      };

      const handleSendAnswer = async () => {
        if (!inputText.trim() || submitting) return;
        setSubmitting(true);

        const activeQ = questions.find(q => q.day_index === currentDay);
        if (!activeQ) return;

        const { error } = await supabase.from('answers').upsert({
          question_id: activeQ.id,
          user_tag: currentUser,
          answer_text: inputText.trim()
        }, { onConflict: 'question_id,user_tag' });

        if (!error) {
          setInputText('');
          if (window.confetti) {
            window.confetti({
              particleCount: 70,
              spread: 60,
              origin: { y: 0.7 },
              colors: ['#f43f5e', '#fbbf24', '#f472b6']
            });
          }
          await loadAnswers(currentDay);
        }
        setSubmitting(false);
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-[#0b0b0e] text-neutral-400 flex items-center justify-center font-serif text-lg tracking-wide">
            Kapszula nyitása...
          </div>
        );
      }

      const activeQuestion = questions.find(q => q.day_index === currentDay) || questions[0];
      const myAnswer = answers[currentUser];
      const partnerAnswer = answers[partnerUser];
      const isBothAnswered = Boolean(myAnswer && partnerAnswer);

      return (
        <div className="min-h-screen bg-[#0b0b0e] text-neutral-100 flex justify-center px-4 py-8">
          <main className="w-full max-w-md flex flex-col gap-6">
            
            {/* Fejléc */}
            <header className="flex justify-between items-center border-b border-neutral-800/80 pb-4">
              <div className="flex items-center gap-2">
                <span className="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-[11px] uppercase tracking-widest text-neutral-400 font-mono">Privát Kapcsolat</span>
              </div>
              <div className="text-xs px-3 py-1 rounded-full bg-neutral-900 border border-neutral-800 text-neutral-300 font-mono">
                {currentUser === 'me' ? '👑 Én nézet' : '✨ Ő nézet'}
              </div>
            </header>

            {/* Napválasztó léptető */}
            <nav className="flex items-center justify-between bg-neutral-900/40 p-1.5 rounded-xl border border-neutral-800/60">
              <button 
                onClick={() => {
                  if (currentDay > 1) {
                    const newDay = currentDay - 1;
                    setCurrentDay(newDay);
                    loadAnswers(newDay);
                  }
                }}
                disabled={currentDay === 1}
                className="px-3 py-1.5 text-xs font-mono rounded-lg transition disabled:opacity-30 hover:bg-neutral-800 active:scale-95"
              >
                ← Előző
              </button>
              <span className="text-xs font-mono text-amber-300/90 font-medium tracking-wide">
                {currentDay}. Nap / {questions.length}
              </span>
              <button 
                onClick={() => {
                  if (currentDay < questions.length) {
                    const newDay = currentDay + 1;
                    setCurrentDay(newDay);
                    loadAnswers(newDay);
                  }
                }}
                disabled={currentDay === questions.length}
                className="px-3 py-1.5 text-xs font-mono rounded-lg transition disabled:opacity-30 hover:bg-neutral-800 active:scale-95"
              >
                Következő →
              </button>
            </nav>

            {/* Fő Kérdés Kártya */}
            <section className="bg-gradient-to-b from-neutral-900/80 to-neutral-900/40 border border-neutral-800/90 rounded-3xl p-6 backdrop-blur-xl shadow-2xl relative">
              <div className="flex items-center justify-between mb-3 text-[11px] font-mono tracking-wider text-amber-400/90 uppercase">
                <span>✦ KÉRDÉS #{activeQuestion?.day_index}</span>
                <span className="text-neutral-500">{activeQuestion?.category}</span>
              </div>
              <h1 className="text-xl leading-relaxed text-neutral-100 font-serif italic mb-3">
                "{activeQuestion?.question_text}"
              </h1>
              {activeQuestion?.task_text && (
                <div className="mt-3 p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl text-xs text-amber-200/90 flex items-start gap-2">
                  <span className="text-sm">📌</span>
                  <span><strong>Kihívás:</strong> {activeQuestion.task_text}</span>
                </div>
              )}
            </section>

            {/* Saját válasz űrlap */}
            {!myAnswer ? (
              <section className="bg-neutral-900/50 border border-neutral-800/80 rounded-2xl p-5 flex flex-col gap-3">
                <div className="flex justify-between items-center text-xs">
                  <label className="text-neutral-300 font-medium">A te titkos válaszod:</label>
                  <span className="text-[10px] text-neutral-500 font-mono">Csak ő látja majd</span>
                </div>
                <textarea
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  placeholder="Írd le bátran... a másik válasza csak akkor nyílik ki, ha te is megosztottad a tiédet."
                  rows={3}
                  className="w-full bg-[#070709] border border-neutral-800/90 rounded-xl p-3.5 text-sm text-neutral-200 placeholder:text-neutral-600 focus:outline-none focus:border-amber-400/50 transition-all resize-none"
                />
                <button
                  onClick={handleSendAnswer}
                  disabled={submitting || !inputText.trim()}
                  className="w-full py-3 bg-gradient-to-r from-amber-500/20 via-rose-500/20 to-purple-500/20 hover:from-amber-500/30 hover:to-rose-500/30 border border-amber-500/40 rounded-xl text-sm font-medium text-amber-100 transition-all active:scale-[0.98] disabled:opacity-40"
                >
                  {submitting ? "Mentés..." : "✦ Válasz lezárása & küldése"}
                </button>
              </section>
            ) : (
              <div className="p-3.5 rounded-xl bg-emerald-950/20 border border-emerald-500/20 text-emerald-300/90 text-xs flex items-center justify-between">
                <span>✓ Erre a kérdésre már megadtad a válaszodat.</span>
                <span className="font-mono text-[10px] opacity-75">Elküldve</span>
              </div>
            )}

            {/* Közös fal / Válaszok */}
            <section className="flex flex-col gap-3 pt-2">
              <div className="flex items-center justify-between px-1">
                <h2 className="text-xs uppercase tracking-widest text-neutral-500 font-mono">Közös napló</h2>
                {isBothAnswered && (
                  <span className="text-[10px] text-emerald-400 font-mono tracking-wide">● Mindketten válaszoltatok</span>
                )}
              </div>

              {/* Saját válasz kártya */}
              <div className="p-4 rounded-2xl bg-neutral-900/30 border border-neutral-800/70">
                <div className="text-[11px] text-neutral-400 mb-1 font-mono">Te:</div>
                <p className="text-sm text-neutral-200 italic leading-relaxed">
                  {myAnswer ? `„${myAnswer}”` : "Még nem írtál választ erre a kérdésre."}
                </p>
              </div>

              {/* Partner válasz kártya (kettős-vak védelem) */}
              <div className="p-4 rounded-2xl bg-neutral-900/30 border border-neutral-800/70 relative overflow-hidden">
                <div className="flex justify-between items-center mb-1">
                  <span className="text-[11px] text-neutral-400 font-mono">Ő:</span>
                  {!isBothAnswered && <span className="text-xs text-amber-400/80">🔒 Zárolva</span>}
                </div>

                {isBothAnswered ? (
                  <p className="text-sm text-amber-100 font-serif leading-relaxed italic">
                    „{partnerAnswer}”
                  </p>
                ) : (
                  <div className="py-4 flex flex-col items-center justify-center text-center gap-1.5">
                    <div className="filter blur-sm select-none text-xs text-neutral-500">
                      Ez a válasz mindkettőtök számára el van rejtve a kölcsönös válaszig.
                    </div>
                    <span className="text-[11px] text-amber-400/80 tracking-wide font-mono mt-1">
                      {!partnerAnswer ? "Még nem válaszolt..." : "Ő már megírta! Írd meg te is, hogy feloldódjon!"}
                    </span>
                  </div>
                )}
              </div>
            </section>

            {/* Időkapszula beharangozó */}
            <footer className="mt-4 p-5 rounded-2xl border border-neutral-800/60 bg-gradient-to-b from-neutral-900/30 to-black text-center flex flex-col items-center gap-2">
              <span className="text-base">⏳</span>
              <div className="text-xs font-mono text-neutral-400 tracking-wider">KÖZÖS IDŐKAPSZULA</div>
              <p className="text-[11px] text-neutral-500 max-w-xs leading-relaxed">
                Ide töltünk majd fel egy közös képet és üzenetet, ami 6 hónapig zárva marad.
              </p>
            </footer>

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
